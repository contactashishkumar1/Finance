    <div id="navbar"></div>
    <script>
        // NAVIGATION & FOOTER DYNAMIC FETCH
        fetch('/navbar.html').then(r => r.text()).then(h => {
        document.getElementById('navbar').innerHTML = h;
        const btn = document.getElementById('menuBtn');
        const menu = document.getElementById('mobileMenu');
        if (btn && menu) btn.addEventListener('click', () => menu.classList.toggle('hidden'));

            return "₹" + formatter.format(val);
        }

        function formatCompact(val) {
            return new Intl.NumberFormat('en-IN', { notation: 'compact', maximumFractionDigits: 1 }).format(val);
        }

        function updateCalculations() {
            const cash = parseFloat(elements.cash.value) || 0;
            const inventory = parseFloat(elements.inventory.value) || 0;
            const receivable = parseFloat(elements.receivable.value) || 0;
            const totalAssets = cash + inventory + receivable;

            const payable = parseFloat(elements.payable.value) || 0;
            const loans = parseFloat(elements.loans.value) || 0;
            const accrued = parseFloat(elements.accrued.value) || 0;
            const totalLiabilities = payable + loans + accrued;

            const workingCapital = totalAssets - totalLiabilities;
            const currentRatio = totalLiabilities > 0 ? (totalAssets / totalLiabilities).toFixed(2) : totalAssets > 0 ? "Infinite" : "0.00";

            // Results Display
            elements.wcValue.textContent = formatIndian(workingCapital);
            elements.ratioDisp.textContent = currentRatio;
            elements.assetCard.textContent = formatIndian(totalAssets);
            elements.liabilityCard.textContent = formatIndian(totalLiabilities);

            // Visualization
            const totalScope = totalAssets + totalLiabilities;
            const assetP = totalScope > 0 ? (totalAssets / totalScope) * 100 : 50;
            elements.assetBar.style.width = `${assetP}%`;
            elements.liabilityBar.style.width = `${100 - assetP}%`;
            
            elements.assetLab.textContent = `Assets: ${formatCompact(totalAssets)}`;
            elements.liabilityLab.textContent = `Debt: ${formatCompact(totalLiabilities)}`;

            renderTable(cash, inventory, receivable, totalAssets);
        }

        function renderTable(cash, inv, rec, total) {
            elements.table.innerHTML = '';
            const categories = [
                { name: 'Cash & Bank', val: cash, liq: 'High' },
                { name: 'Accounts Receivable', val: rec, liq: 'Medium' },
                { name: 'Inventory', val: inv, liq: 'Low' }
            ];

            categories.forEach(item => {
                const weight = total > 0 ? (item.val / total) * 100 : 0;
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition-colors';
                row.innerHTML = `
                    <td class="px-3 py-3 border-b border-slate-100 font-medium text-slate-700">${item.name}</td>
                    <td class="px-3 py-3 border-b border-slate-100 text-right text-slate-600">₹${item.val.toLocaleString('en-IN')}</td>
                    <td class="px-3 py-3 border-b border-slate-100 text-right text-indigo-600 font-bold">${weight.toFixed(1)}%</td>
                    <td class="px-3 py-3 border-b border-slate-100 text-right font-black text-slate-800 text-[10px] uppercase">${item.liq}</td>
                `;
                elements.table.appendChild(row);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const inputs = [elements.cash, elements.inventory, elements.receivable, elements.payable, elements.loans, elements.accrued];
            inputs.forEach(input => input.addEventListener('input', updateCalculations));
            elements.calcBtn.addEventListener('click', updateCalculations);
            updateCalculations();
        });
    </script>
